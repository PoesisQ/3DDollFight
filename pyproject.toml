[project]
name = "dollfight"
version = "0.5.0"
description = "Engine-independent RGB-D skeleton and motion research for a 3D vision course."
readme = "README.md"
requires-python = ">=3.10.19,<3.11"
dependencies = ["numpy>=1.26.4,<2", "jsonschema>=4.23,<5"]

[dependency-groups]
assets = [
    "gradio-client==2.7.2",
    "pillow>=11.3,<12",
]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.9.17"
cache-dir = ".uv-cache"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
